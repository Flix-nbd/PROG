<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PROG">
<meta name="theme-color" content="#0A0A0F">
<title>PROG — Félix</title>
<style>
:root{
  --bg:#0A0A0F;
  --card:#111116;
  --card2:#18181F;
  --card3:#202028;
  --border:#222230;
  --border2:#2C2C3A;
  --txt:#ECECF4;
  --txt2:#8080A0;
  --txt3:#404058;
  --accent:#FFFFFF;
  --accent-dim:#606070;
  --done:#4CAF50;
  --warn:#E0A020;
  --safe-t:env(safe-area-inset-top,44px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,"SF Pro Display","Helvetica Neue",sans-serif;min-height:100dvh;overscroll-behavior:none}
.screen{display:none;min-height:100dvh}.screen.active{display:block}

/* ── Header ── */
.hdr{position:sticky;top:0;z-index:100;padding:var(--safe-t) 20px 12px;background:rgba(10,10,15,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.hdr-row{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.hdr-title{font-size:20px;font-weight:800;letter-spacing:-1px;color:var(--txt)}
.hdr-dot{color:var(--txt3)}
.hdr-sub{font-size:11px;color:var(--txt3);margin-top:1px}
.week-pill{display:flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--border2);border-radius:20px;padding:5px 10px}
.week-pill button{background:none;border:none;color:var(--txt2);font-size:16px;cursor:pointer;padding:0 2px;line-height:1}
.week-label{font-size:11px;font-weight:700;color:var(--txt2)}

/* ── Lieu scroller ── */
.lieu-scroll-wrap{
  overflow:hidden;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  position:sticky;top:calc(var(--safe-t) + 56px);
  z-index:99;
}
.lieu-scroll{
  display:flex;gap:6px;
  overflow-x:auto;scrollbar-width:none;
  padding:10px 16px;
  scroll-snap-type:x mandatory;
}
.lieu-scroll::-webkit-scrollbar{display:none}
.lieu-chip{
  flex-shrink:0;scroll-snap-align:start;
  display:flex;align-items:center;gap:5px;
  padding:7px 14px;border-radius:20px;
  border:1px solid var(--border2);
  background:var(--card);color:var(--txt3);
  font-size:12px;font-weight:600;cursor:pointer;
  transition:all .2s;white-space:nowrap;
}
.lieu-chip.active{background:var(--card3);border-color:var(--txt2);color:var(--txt)}
.lieu-chip .pin{font-size:11px}
.lieu-add{
  flex-shrink:0;padding:7px 14px;border-radius:20px;
  border:1px dashed var(--border2);background:none;
  color:var(--txt3);font-size:12px;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:all .2s;
}
.lieu-add:active{background:var(--card)}

/* ── Nav ── */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:100;padding:8px 4px;padding-bottom:calc(8px + var(--safe-b));background:rgba(10,10,15,.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--border);display:flex;justify-content:space-around}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;padding:4px 16px;border-radius:10px}
.nav-btn .ni{font-size:18px;line-height:1;filter:grayscale(1) opacity(.4)}
.nav-btn .nl{font-size:9px;font-weight:600;color:var(--txt3);letter-spacing:.5px;text-transform:uppercase}
.nav-btn.active .ni{filter:grayscale(0) opacity(1)}
.nav-btn.active .nl{color:var(--txt2)}

/* ── Content ── */
.content{padding:14px 16px;padding-bottom:calc(90px + var(--safe-b))}

/* ── Section label ── */
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt3);margin-bottom:10px;padding:0 2px}

/* ── Session cards ── */
.session-card{
  background:var(--card);border:1px solid var(--border2);
  border-radius:16px;margin-bottom:8px;overflow:hidden;
  cursor:pointer;transition:all .15s;
}
.session-card:active{transform:scale(.98);background:var(--card2)}
.session-card.current{border-color:var(--txt2)}
.session-card.done-card{opacity:.35}
.sc-inner{display:flex;align-items:center;padding:14px 16px;gap:14px}
.sc-icon{
  width:40px;height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
  background:var(--card2);border:1px solid var(--border2);
  color:var(--txt2);font-weight:700;font-size:13px;letter-spacing:-.5px;
}
.session-card.current .sc-icon{background:var(--card3);border-color:var(--txt2);color:var(--txt)}
.sc-info{flex:1}
.sc-name{font-size:15px;font-weight:700;color:var(--txt);letter-spacing:-.3px}
.sc-sub{font-size:11px;color:var(--txt3);margin-top:2px}
.sc-status{font-size:10px;font-weight:600;color:var(--txt3);border:1px solid var(--border2);border-radius:20px;padding:3px 10px}
.session-card.current .sc-status{color:var(--txt2);border-color:var(--txt2)}
.session-card.done-card .sc-status{color:var(--done);border-color:var(--done)}
.sc-chevron{color:var(--txt3);font-size:16px}
.sc-bar{height:2px;background:var(--border)}
.sc-progress{height:2px;background:var(--txt3);transition:width .4s}
.session-card.current .sc-progress{background:var(--txt2)}

/* ── Workout ── */
.workout-hdr{padding:var(--safe-t) 16px 0;background:rgba(10,10,15,.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border)}
.wk-top{display:flex;align-items:center;gap:12px;padding:8px 0 12px}
.back-btn{background:var(--card2);border:1px solid var(--border2);border-radius:10px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--txt2);cursor:pointer;flex-shrink:0;font-size:16px}
.wk-title{font-size:18px;font-weight:800;letter-spacing:-.5px;flex:1;color:var(--txt)}
.wk-ring{position:relative;width:38px;height:38px;flex-shrink:0}
.wk-ring svg{transform:rotate(-90deg)}
.ring-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--txt2)}

/* Warn */
.warn-box{background:rgba(224,160,32,.06);border:1px solid rgba(224,160,32,.2);border-left:3px solid var(--warn);border-radius:12px;padding:10px 12px;font-size:11px;color:#D4A020;margin-bottom:14px;line-height:1.5}

/* Block */
.block-lbl{font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt3);margin:16px 0 7px 2px}

/* Ex card */
.ex-card{background:var(--card);border:1px solid var(--border2);border-radius:14px;margin-bottom:7px;overflow:hidden;transition:opacity .2s}
.ex-card.done{opacity:.3}
.ex-card.done .ex-name{text-decoration:line-through}
.ex-row{display:flex;align-items:center;padding:12px 14px;gap:12px;cursor:pointer}
.ex-check{width:24px;height:24px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:all .2s;cursor:pointer}
.ex-card.done .ex-check{background:var(--done);border-color:var(--done);color:#fff}
.ex-body{flex:1;min-width:0}
.ex-biset{font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--txt3);margin-bottom:2px;text-transform:uppercase}
.ex-name{font-size:13px;font-weight:700;color:var(--txt);line-height:1.3}
.ex-sets{font-size:11px;color:var(--txt3);margin-top:2px}
.ex-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.ex-wt{font-size:20px;font-weight:900;letter-spacing:-1px;color:var(--txt);line-height:1}
.ex-wt small{display:block;font-size:9px;font-weight:500;color:var(--txt3);text-align:right}
.derog-badge{font-size:8px;font-weight:700;color:var(--warn);background:rgba(224,160,32,.1);border:1px solid rgba(224,160,32,.25);border-radius:5px;padding:2px 5px}
.ex-alt{padding:0 14px 10px 50px;font-size:11px;color:var(--txt3);font-style:italic;display:none}
.ex-card.expanded .ex-alt{display:block}
.ex-extra{display:none;padding:0 14px 12px 50px;flex-direction:column;gap:8px}
.ex-card.expanded .ex-extra{display:flex}
.perf-row{display:flex;gap:6px;align-items:center}
.perf-input{flex:1;background:var(--card2);border:1px solid var(--border2);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;color:var(--txt);text-align:center;-webkit-appearance:none}
.perf-input::placeholder{color:var(--txt3);font-weight:400}
.rpe-sel{display:flex;gap:3px}
.rpe-btn{padding:6px 7px;border-radius:7px;border:1px solid var(--border2);background:var(--card2);color:var(--txt3);font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
.rpe-btn.active{border-color:var(--txt2);color:var(--txt);background:var(--card3)}
.derog-row{display:flex;align-items:center;gap:8px}
.derog-label{font-size:11px;color:var(--warn);font-weight:600;flex-shrink:0}
.derog-input{width:68px;background:rgba(224,160,32,.06);border:1px solid rgba(224,160,32,.25);border-radius:10px;padding:7px 8px;font-size:13px;font-weight:700;color:var(--warn);text-align:center;-webkit-appearance:none}
.derog-input::placeholder{color:rgba(224,160,32,.3);font-weight:400}
.derog-reset{font-size:11px;color:var(--txt3);background:none;border:none;cursor:pointer;text-decoration:underline}

/* Timer FAB */
.timer-fab{position:fixed;right:16px;bottom:calc(78px + var(--safe-b));z-index:99;width:48px;height:48px;border-radius:50%;background:var(--card2);border:1px solid var(--border2);display:none;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all .2s}
.timer-fab.visible{display:flex}
.timer-fab.running{border-color:var(--txt2);background:var(--card3)}

/* Timer overlay */
.timer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .3s}
.timer-overlay.show{opacity:1;pointer-events:all}
.timer-modal{background:var(--card);border:1px solid var(--border2);border-radius:24px 24px 0 0;padding:20px 24px;padding-bottom:calc(24px + var(--safe-b));width:100%;max-width:500px}
.timer-drag{width:32px;height:3px;background:var(--border2);border-radius:3px;margin:0 auto 18px}
.timer-title{font-size:11px;font-weight:700;color:var(--txt3);text-align:center;margin-bottom:18px;letter-spacing:1px;text-transform:uppercase}
.timer-count{font-size:68px;font-weight:900;letter-spacing:-4px;text-align:center;color:var(--txt);font-variant-numeric:tabular-nums;line-height:1}
.timer-count.warning{color:var(--warn)}
.timer-count.done-clr{color:var(--done)}
.timer-bar-wrap{height:3px;background:var(--border2);border-radius:3px;margin:12px 0 20px;overflow:hidden}
.timer-bar{height:3px;border-radius:3px;background:var(--txt2);transition:width .1s linear}
.timer-presets{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.t-preset{padding:7px 12px;border-radius:20px;border:1px solid var(--border2);background:var(--card2);color:var(--txt3);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s}
.t-preset.active{border-color:var(--txt2);color:var(--txt);background:var(--card3)}
.timer-custom{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:18px}
.timer-custom label{font-size:11px;color:var(--txt3)}
.timer-custom input{width:50px;background:var(--card2);border:1px solid var(--border2);border-radius:8px;padding:6px 8px;font-size:13px;font-weight:700;color:var(--txt2);text-align:center;-webkit-appearance:none}
.timer-controls{display:flex;gap:8px;margin-bottom:12px}
.t-btn{flex:1;padding:14px;border-radius:12px;border:none;font-size:14px;font-weight:800;cursor:pointer;transition:all .2s}
.t-btn:active{transform:scale(.96)}
.t-btn.start{background:var(--txt);color:var(--bg)}
.t-btn.pause{background:var(--card2);color:var(--txt2);border:1px solid var(--border2)}
.t-btn.reset{background:var(--card2);color:var(--txt3);border:1px solid var(--border2)}
.t-close{width:100%;padding:11px;border-radius:10px;border:none;background:none;color:var(--txt3);font-size:13px;cursor:pointer}

/* WOD */
.wod-opt{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:12px 14px;margin-bottom:7px;cursor:pointer;transition:border-color .2s}
.wod-opt.selected{border-color:var(--txt2);background:var(--card2)}
.wod-ico{font-size:22px;flex-shrink:0;filter:grayscale(1)}
.wod-opt.selected .wod-ico{filter:none}
.wod-info{flex:1}
.wod-name{font-size:13px;font-weight:700;color:var(--txt)}
.wod-desc{font-size:11px;color:var(--txt3);margin-top:2px}
.wod-avail{font-size:10px;color:var(--txt3);margin-top:2px}

/* Mob */
.mob-toggle{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:12px 16px;cursor:pointer;margin-top:14px;font-size:13px;font-weight:600;color:var(--txt2)}
.mob-chev{font-size:10px;color:var(--txt3);transition:transform .3s}
.mob-toggle.open .mob-chev{transform:rotate(180deg)}
.mob-items{display:none;margin-top:6px}
.mob-items.open{display:block}
.mob-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);border:1px solid var(--border2);border-radius:10px;margin-bottom:6px}
.mob-name{font-size:13px;font-weight:600;color:var(--txt)}
.mob-zone{font-size:10px;color:var(--txt3);margin-top:1px}
.mob-dur{font-size:11px;font-weight:700;color:var(--txt2)}

/* Validate bar */
.validate-bar{position:fixed;bottom:0;left:0;right:0;padding:10px 16px;padding-bottom:calc(10px + var(--safe-b));background:rgba(10,10,15,.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);z-index:99}
.validate-btn{width:100%;padding:15px;border-radius:13px;border:none;font-size:14px;font-weight:800;cursor:pointer;transition:all .2s;background:var(--txt);color:var(--bg)}
.validate-btn:active{transform:scale(.97)}
.validate-btn.done-mode{background:var(--card2);color:var(--done);border:1px solid rgba(76,175,80,.3)}

/* History */
.hist-empty{text-align:center;padding:60px 20px;color:var(--txt3)}
.hist-empty .icon{font-size:40px;margin-bottom:12px;filter:grayscale(1)}
.hist-date-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);margin:16px 0 8px}
.hist-entry{background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:14px 16px;margin-bottom:7px}
.hist-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hist-sess{font-size:14px;font-weight:800;color:var(--txt)}
.hist-lieu{font-size:10px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--card2);color:var(--txt3)}
.hist-exos{display:flex;flex-direction:column;gap:3px}
.hist-exo{display:flex;justify-content:space-between;font-size:12px}
.hist-exo-name{color:var(--txt3)}
.hist-exo-val{font-weight:700;color:var(--txt)}

/* Charts */
.chart-wrap{background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:16px;margin-bottom:16px}
.chart-selector{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.chart-btn{padding:4px 10px;border-radius:20px;border:1px solid var(--border2);background:var(--card2);color:var(--txt3);font-size:10px;font-weight:600;cursor:pointer}
.chart-btn.active{border-color:var(--txt2);color:var(--txt);background:var(--card3)}
.chart-empty{text-align:center;color:var(--txt3);font-size:12px;padding:24px 0}

/* Settings */
.settings-section{margin-bottom:22px}
.settings-title{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--txt3);margin-bottom:8px;padding:0 2px}
.setting-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border2);border-radius:13px;padding:13px 16px;margin-bottom:7px;cursor:pointer}
.setting-label{font-size:14px;font-weight:600;color:var(--txt)}
.setting-sub{font-size:11px;color:var(--txt3);margin-top:2px}
.s-btn{background:var(--card2);border:1px solid var(--border2);border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--txt2);cursor:pointer}
.s-num{font-size:15px;font-weight:800;color:var(--txt);min-width:40px;text-align:center}

/* Lieu edit */
.lieu-edit-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.lieu-edit-row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:10px 14px}
.lieu-edit-input{flex:1;background:none;border:none;font-size:14px;font-weight:600;color:var(--txt);outline:none}
.lieu-edit-del{background:none;border:none;color:var(--txt3);font-size:18px;cursor:pointer;padding:0 2px;line-height:1}
.lieu-add-row{display:flex;gap:8px}
.lieu-add-input{flex:1;background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--txt);outline:none}
.lieu-add-input::placeholder{color:var(--txt3)}
.lieu-add-btn{background:var(--card2);border:1px solid var(--border2);border-radius:12px;padding:10px 16px;font-size:13px;font-weight:700;color:var(--txt2);cursor:pointer}

.ex-edit-card{background:var(--card);border:1px solid var(--border2);border-radius:13px;padding:13px 16px;margin-bottom:7px}
.ex-edit-name{font-size:13px;font-weight:700;color:var(--txt);margin-bottom:10px}
.ex-edit-fields{display:flex;gap:6px;flex-wrap:wrap}
.field-group{display:flex;flex-direction:column;align-items:center;gap:3px}
.field-lbl{font-size:8px;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px}
.field-inp{background:var(--card2);border:1px solid var(--border2);border-radius:8px;padding:6px 8px;font-size:13px;font-weight:700;color:var(--txt2);width:65px;text-align:center;-webkit-appearance:none}

/* Toast */
.toast{position:fixed;top:calc(var(--safe-t) + 64px);left:50%;transform:translateX(-50%) translateY(-8px);background:var(--card3);border:1px solid var(--border2);color:var(--txt);padding:10px 18px;border-radius:20px;font-size:12px;font-weight:700;opacity:0;transition:all .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.div{height:1px;background:var(--border);margin:14px 0}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="screen-home">
  <div class="hdr">
    <div class="hdr-row">
      <div>
        <div class="hdr-title">PROG<span class="hdr-dot"> · </span>Félix</div>
        <div class="hdr-sub" id="home-date"></div>
      </div>
      <div class="week-pill">
        <button onclick="changeWeek(-1)">‹</button>
        <span class="week-label">S<span id="wkNum">1</span></span>
        <button onclick="changeWeek(1)">›</button>
      </div>
    </div>
  </div>
  <div class="lieu-scroll-wrap">
    <div class="lieu-scroll" id="lieu-scroll"></div>
  </div>
  <div class="content">
    <div class="sec-lbl">Séances</div>
    <div id="session-cards"></div>
  </div>
</div>

<!-- WORKOUT -->
<div class="screen" id="screen-workout">
  <div class="workout-hdr">
    <div class="wk-top">
      <div class="back-btn" onclick="goHome()">←</div>
      <div class="wk-title" id="wk-title"></div>
      <div class="wk-ring">
        <svg width="38" height="38" viewBox="0 0 38 38">
          <circle cx="19" cy="19" r="15" fill="none" stroke="#222230" stroke-width="2.5"/>
          <circle id="wk-ring-val" cx="19" cy="19" r="15" fill="none" stroke-width="2.5" stroke-linecap="round"
            stroke="#8080A0" stroke-dasharray="94.2" stroke-dashoffset="94.2" style="transition:stroke-dashoffset .4s ease"/>
        </svg>
        <div class="ring-pct" id="wk-pct">0%</div>
      </div>
    </div>
  </div>
  <div class="content" id="wk-content" style="padding-top:8px;padding-bottom:140px"></div>
  <div class="validate-bar">
    <button class="validate-btn" id="validate-btn" onclick="validateSession()"></button>

const ORDER=['push','pull','leg','bras'];
const MOBILITE=[
  {name:'Pigeon au sol',dur:'45s/côté',zone:'Fessier + hanche — post-ménisque'},
  {name:'Étirement ischio',dur:'35s/côté',zone:'Ischios · jambe tendue'},
  {name:'Cat-cow',dur:'10 reps',zone:'Lombaires · lent, respire'},
  {name:"Child's pose",dur:'45s',zone:'Lombaires + dos'},
  {name:'Hip flexor lunge',dur:'30s/côté',zone:'Fléchisseurs hanche'},
  {name:'Rotation thoracique',dur:'8/côté',zone:'Colonne · genoux fléchis'},
  {name:'Extensions lombaires',dur:'3×15',zone:'Lombaires · banc déclinaison'},
];

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
let S={
  lieu:'HOME',week:1,currentWorkout:null,
  sessionDone:{},exDone:{},perf:{},derog:{},
  selectedWod:null,mobOpen:false,
  poids:JSON.parse(JSON.stringify(DEFAULT_POIDS)),
  lieux:['HOME','BUREAU','PA'],
  history:[],
  timerDuration:120,
};
let chartKey='Dév. couché';

function save(){try{localStorage.setItem('prog4',JSON.stringify(S))}catch(e){}}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('prog4'));
    if(d){
      const p=Object.assign({},JSON.parse(JSON.stringify(DEFAULT_POIDS)),d.poids||{});
      S={...S,...d,poids:p};
      if(!S.lieux||!S.lieux.length) S.lieux=['HOME','BUREAU','PA'];
    }
  }catch(e){}
}

function getPoids(key,lieu,week){
  const e=S.poids[key]; if(!e) return null;
  const base=e[lieu]||0; if(!base) return null;
  return Math.round(base+(week-1)*(e.inc||0));
}
function getDispWeight(key,idx,sid){
  const auto=key?getPoids(key,S.lieu,S.week):null;
  const d=S.derog[sid]&&S.derog[sid][idx]!=null?S.derog[sid][idx]:null;
  return {auto,display:d!==null?d:auto,isDerog:d!==null};
}

// ═══════════════════════════════════════
// NAV
// ═══════════════════════════════════════
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const nb=document.getElementById('nav-'+id);
  if(nb) nb.classList.add('active');
  document.getElementById('main-nav').style.display='flex';
  document.getElementById('timer-fab').classList.remove('visible');
  if(id==='home') renderHome();
  if(id==='history') renderHistory();
  if(id==='settings') renderSettings();
}
function openWorkout(sid){
  S.currentWorkout=sid;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-workout').classList.add('active');
  document.getElementById('main-nav').style.display='none';
  document.getElementById('timer-fab').classList.add('visible');
  renderWorkout();
}
function goHome(){document.getElementById('timer-fab').classList.remove('visible');showScreen('home');}

// ═══════════════════════════════════════
// LIEU SCROLLER
// ═══════════════════════════════════════
function renderLieuScroll(){
  const el=document.getElementById('lieu-scroll');
  let html='';
  S.lieux.forEach(l=>{
    html+=`<div class="lieu-chip${l===S.lieu?' active':''}" onclick="setLieu('${l}')">
      <span class="pin">📍</span>${l}
    </div>`;
  });
  html+=`<button class="lieu-add" onclick="showScreen('settings');setTimeout(()=>document.getElementById('lieu-section').scrollIntoView({behavior:'smooth'}),300)">+ Lieu</button>`;
  el.innerHTML=html;
}

// ═══════════════════════════════════════
// HOME
// ═══════════════════════════════════════
function renderHome(){
  document.getElementById('home-date').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('wkNum').textContent=S.week;
  renderLieuScroll();
  const nextSid=ORDER.find(s=>!S.sessionDone[s])||ORDER[0];
  let html='';
  ORDER.forEach(sid=>{
    const sess=SESSIONS_DEF[sid];
    const done=!!S.sessionDone[sid];
    const isCurrent=sid===nextSid;
    const exDoneMap=S.exDone[sid]||{};
    const allExos=sess.blocks.flatMap(b=>b.exos);
    const doneCount=allExos.filter((_,i)=>exDoneMap[i]).length;
    const pct=allExos.length?Math.round(doneCount/allExos.length*100):0;
    const statusTxt=done?'✓ Fait':(isCurrent?'→ Maintenant':'À venir');
    html+=`<div class="session-card${done?' done-card':''}${isCurrent?' current':''}" onclick="openWorkout('${sid}')">
      <div class="sc-inner">
        <div class="sc-icon">${sess.short}</div>
        <div class="sc-info">
          <div class="sc-name">${sess.label}</div>
          <div class="sc-sub">${sess.sub}</div>
        </div>
        <div class="sc-status">${statusTxt}</div>
        <div class="sc-chevron">›</div>
      </div>
      <div class="sc-bar"><div class="sc-progress" style="width:${pct}%"></div></div>
    </div>`;
  });
  document.getElementById('session-cards').innerHTML=html;
}

// ═══════════════════════════════════════
// WORKOUT
// ═══════════════════════════════════════
function renderWorkout(){
  const sid=S.currentWorkout;
  const sess=SESSIONS_DEF[sid];
  const doneMap=S.exDone[sid]||{};
  const perfMap=S.perf[sid]||{};
  const allExos=sess.blocks.flatMap(b=>b.exos);
  const doneCount=allExos.filter((_,i)=>doneMap[i]).length;
  const pct=allExos.length?Math.round(doneCount/allExos.length*100):0;
  const circ=94.2,offset=circ-(pct/100)*circ;
  document.getElementById('wk-title').textContent=sess.label;
  document.getElementById('wk-ring-val').setAttribute('stroke-dashoffset',offset);
  document.getElementById('wk-pct').textContent=pct+'%';
  const vb=document.getElementById('validate-btn');
  const isDone=!!S.sessionDone[sid];
  if(isDone){vb.className='validate-btn done-mode';vb.textContent='✓ Validée — Séance suivante →';}
  else{vb.className='validate-btn';vb.textContent=`Valider ${sess.label}`;}

  let html='';
  if(sess.warn) html+=`<div class="warn-box">⚠ ${sess.warn}</div>`;

  // Lieu badge
  html+=`<div style="display:flex;align-items:center;gap:6px;margin-bottom:14px">
    <span style="font-size:11px;color:var(--txt3)">📍</span>
    <span style="font-size:11px;font-weight:700;color:var(--txt2)">${S.lieu}</span>
    <span style="font-size:11px;color:var(--txt3)">·</span>
    <span style="font-size:11px;color:var(--txt3)">Semaine ${S.week}</span>
  </div>`;

  let gi=0;
  for(const block of sess.blocks){
    html+=`<div class="block-lbl">${block.label}</div>`;
    for(const exo of block.exos){
      const idx=gi++;
      const done=!!doneMap[idx];
      const pf=perfMap[idx]||{kg:'',rpe:''};
      const {auto,display,isDerog}=getDispWeight(exo.key||null,idx,sid);
      const wtStr=display!=null?display:(exo.bw?'PC':'—');
      html+=`<div class="ex-card${done?' done':''}" id="ex-${idx}">
        <div class="ex-row" onclick="toggleExpand(${idx})">
          <div class="ex-check" onclick="event.stopPropagation();toggleExo(${idx})">${done?'✓':''}</div>
          <div class="ex-body">
            ${exo.biset?'<div class="ex-biset">Biset</div>':''}
            <div class="ex-name">${exo.name}</div>
            <div class="ex-sets">${exo.sets}</div>
          </div>
          <div class="ex-right">
            <div class="ex-wt">${wtStr}${display!=null?'<small>kg</small>':''}</div>
            ${isDerog?'<div class="derog-badge">DÉROG</div>':''}
          </div>
        </div>
        <div class="ex-alt">↗ ${exo.alt}</div>
        <div class="ex-extra">
          <div class="perf-row">
            <input class="perf-input" type="number" placeholder="kg réel" value="${pf.kg}"
              onchange="savePerf(${idx},'kg',this.value)" inputmode="decimal">
            <div class="rpe-sel">
              ${[6,7,8,9,10].map(r=>`<div class="rpe-btn${pf.rpe==r?' active':''}" onclick="savePerf(${idx},'rpe',${r})">${r}</div>`).join('')}
            </div>
          </div>
          ${auto!=null?`<div class="derog-row">
            <span class="derog-label">⚡ Dérog</span>
            <input class="derog-input" type="number" placeholder="${auto}kg"
              value="${isDerog?display:''}" onchange="saveDerog(${idx},this.value)" inputmode="decimal">
            <span style="font-size:11px;color:var(--txt3)">kg</span>
            ${isDerog?`<button class="derog-reset" onclick="resetDerog(${idx})">Annuler</button>`:''}
          </div>`:''}
        </div>
      </div>`;
    }
  }

  if(sess.wod){
    html+=`<div class="block-lbl">WOD / Ergo — choisir</div>`;
    sess.wod.forEach((w,i)=>{
      const sel=S.selectedWod===i;
      html+=`<div class="wod-opt${sel?' selected':''}" onclick="selWod(${i})">
        <span class="wod-ico">${w.icon}</span>
        <div class="wod-info">
          <div class="wod-name">${w.name}</div>
          <div class="wod-desc">${w.desc}</div>
          <div class="wod-avail">📍 ${w.avail}</div>
        </div>${sel?'<span style="color:var(--txt2)">✓</span>':''}
      </div>`;
    });
  }

  html+=`<div class="mob-toggle${S.mobOpen?' open':''}" onclick="toggleMob()">
    <span>Mobilité du jour</span><span class="mob-chev">▲</span>
  </div>
  <div class="mob-items${S.mobOpen?' open':''}">
    ${MOBILITE.map(m=>`<div class="mob-item">
      <div><div class="mob-name">${m.name}</div><div class="mob-zone">${m.zone}</div></div>
      <div class="mob-dur">${m.dur}</div>
    </div>`).join('')}
  </div>`;

  document.getElementById('wk-content').innerHTML=html;
}

function toggleExpand(idx){const c=document.getElementById('ex-'+idx);if(c)c.classList.toggle('expanded');}
function toggleExo(idx){
  const sid=S.currentWorkout;
  if(!S.exDone[sid])S.exDone[sid]={};
  S.exDone[sid][idx]=!S.exDone[sid][idx];
  save();renderWorkout();
}
function savePerf(idx,field,val){
  const sid=S.currentWorkout;
  if(!S.perf[sid])S.perf[sid]={};
  if(!S.perf[sid][idx])S.perf[sid][idx]={kg:'',rpe:''};
  S.perf[sid][idx][field]=val;save();
  if(field==='rpe')renderWorkout();
}
function saveDerog(idx,val){
  const sid=S.currentWorkout;
  if(!S.derog[sid])S.derog[sid]={};
  S.derog[sid][idx]=val===''?null:parseFloat(val);
  save();renderWorkout();
}
function resetDerog(idx){
  const sid=S.currentWorkout;
  if(S.derog[sid])delete S.derog[sid][idx];
  save();renderWorkout();
}
function selWod(i){S.selectedWod=S.selectedWod===i?null:i;save();renderWorkout();}
function toggleMob(){S.mobOpen=!S.mobOpen;save();renderWorkout();}

function validateSession(){
  const sid=S.currentWorkout;
  if(S.sessionDone[sid]){
    const idx=ORDER.indexOf(sid);
    const next=ORDER[(idx+1)%ORDER.length];
    if(next===ORDER[0]){
      showToast('Cycle complet — Semaine '+(S.week+1));
      S.week=Math.min(10,S.week+1);
      S.sessionDone={};S.exDone={};S.perf={};S.derog={};
    } else {
      showToast('→ '+SESSIONS_DEF[next].label);
    }
    S.currentWorkout=next;save();renderWorkout();return;
  }
  S.sessionDone[sid]=true;
  const allExos=SESSIONS_DEF[sid].blocks.flatMap(b=>b.exos);
  if(!S.exDone[sid])S.exDone[sid]={};
  allExos.forEach((_,i)=>{if(!S.exDone[sid][i])S.exDone[sid][i]=true;});
  const entry={
    date:new Date().toISOString(),sid,lieu:S.lieu,week:S.week,
    label:SESSIONS_DEF[sid].label,
    exos:allExos.map((ex,i)=>({
      name:ex.name,
      kg:(S.perf[sid]&&S.perf[sid][i])?S.perf[sid][i].kg:'',
      rpe:(S.perf[sid]&&S.perf[sid][i])?S.perf[sid][i].rpe:'',
    }))
  };
  S.history.unshift(entry);
  showToast(SESSIONS_DEF[sid].label+' validée ✓');
  save();renderWorkout();
}

// ═══════════════════════════════════════
// TIMER
// ═══════════════════════════════════════
let timerInterval=null,timerRemaining=120,timerTotal=120,timerRunning=false;
function openTimer(){document.getElementById('timer-overlay').classList.add('show');updateTimerDisplay();}
function closeTimer(){document.getElementById('timer-overlay').classList.remove('show');}
function handleOverlayClick(e){if(e.target===document.getElementById('timer-overlay'))closeTimer();}
function setPreset(sec){
  document.querySelectorAll('.t-preset').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
  stopTimer();timerTotal=sec;timerRemaining=sec;
  document.getElementById('custom-min').value='';
  document.getElementById('custom-sec').value='';
  updateTimerDisplay();
}
function setCustom(){
  const m=parseInt(document.getElementById('custom-min').value)||0;
  const s=parseInt(document.getElementById('custom-sec').value)||0;
  const total=m*60+s;
  if(total>0){document.querySelectorAll('.t-preset').forEach(b=>b.classList.remove('active'));stopTimer();timerTotal=total;timerRemaining=total;updateTimerDisplay();}
}
function toggleTimer(){timerRunning?pauseTimer():startTimer();}
function startTimer(){
  if(timerRemaining<=0)timerRemaining=timerTotal;
  timerRunning=true;
  document.getElementById('timer-start-btn').textContent='⏸ Pause';
  document.getElementById('timer-fab').classList.add('running');
  timerInterval=setInterval(()=>{
    timerRemaining--;updateTimerDisplay();
    if(timerRemaining<=0){
      clearInterval(timerInterval);timerRunning=false;
      document.getElementById('timer-start-btn').textContent='▶ Start';
      document.getElementById('timer-fab').classList.remove('running');
      if(navigator.vibrate)navigator.vibrate([200,100,200,100,400]);
      showToast('Repos terminé — Go !');
    }
  },1000);
}
function pauseTimer(){clearInterval(timerInterval);timerRunning=false;document.getElementById('timer-start-btn').textContent='▶ Reprendre';document.getElementById('timer-fab').classList.remove('running');}
function stopTimer(){clearInterval(timerInterval);timerRunning=false;document.getElementById('timer-start-btn').textContent='▶ Start';document.getElementById('timer-fab').classList.remove('running');}
function resetTimer(){stopTimer();timerRemaining=timerTotal;updateTimerDisplay();}
function updateTimerDisplay(){
  const m=Math.floor(timerRemaining/60),s=timerRemaining%60;
  const el=document.getElementById('timer-count');
  el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.className='timer-count'+(timerRemaining<=10&&timerRemaining>0?' warning':'')+(timerRemaining<=0?' done-clr':'');
  const pct=timerTotal>0?(timerRemaining/timerTotal)*100:0;
  const bar=document.getElementById('timer-bar');
  bar.style.width=pct+'%';
  bar.style.background=timerRemaining<=10?'var(--warn)':'var(--txt2)';
}

// ═══════════════════════════════════════
// HISTORY + CHARTS
// ═══════════════════════════════════════
function renderHistory(){
  const con=document.getElementById('hist-content');
  const chartableKeys=Object.keys(S.poids);
  let html=`<div class="chart-wrap">
    <div style="font-size:11px;font-weight:700;color:var(--txt2);margin-bottom:10px;letter-spacing:.5px">PROGRESSION</div>
    <div class="chart-selector">
      ${chartableKeys.map(k=>`<button class="chart-btn${k===chartKey?' active':''}" onclick="setChartKey('${k}')">${k}</button>`).join('')}
    </div>`;

  const dataPoints=[];
  S.history.slice().reverse().forEach(e=>{
    e.exos.forEach(ex=>{
      if(ex.name.toLowerCase().includes(chartKey.split(' ')[0].toLowerCase())&&ex.kg){
        dataPoints.push({kg:parseFloat(ex.kg),date:new Date(e.date)});
      }
    });
  });

  if(dataPoints.length<2){
    html+=`<div class="chart-empty">Pas encore assez de données pour ${chartKey}</div>`;
  } else {
    const maxKg=Math.max(...dataPoints.map(d=>d.kg));
    const minKg=Math.min(...dataPoints.map(d=>d.kg));
    const range=maxKg-minKg||1;
    const w=300,h=100,pad=8;
    const pts=dataPoints.map((d,i)=>({
      x:pad+(i/(dataPoints.length-1))*(w-pad*2),
      y:h-pad-(d.kg-minKg)/range*(h-pad*2),
      kg:d.kg
    }));
    const pathD='M'+pts.map(p=>`${p.x},${p.y}`).join(' L');
    const areaD=pathD+` L${pts[pts.length-1].x},${h} L${pts[0].x},${h} Z`;
    html+=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:120px">
      <defs>
        <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8080A0" stop-opacity=".25"/>
          <stop offset="100%" stop-color="#8080A0" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="${areaD}" fill="url(#cg)"/>
      <path d="${pathD}" fill="none" stroke="#8080A0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="2.5" fill="#8080A0"/>
        ${i===pts.length-1?`<text x="${p.x}" y="${p.y-7}" text-anchor="middle" fill="#ECECF4" font-size="9" font-weight="700">${p.kg}kg</text>`:''}`).join('')}
      <text x="${pad}" y="${h-2}" fill="#404058" font-size="8">${minKg}kg</text>
      <text x="${pad}" y="${pad+7}" fill="#404058" font-size="8">${maxKg}kg</text>
    </svg>`;
  }
  html+=`</div>`;

  if(!S.history.length){
    con.innerHTML=html+`<div class="hist-empty"><div class="icon">📊</div><div>Aucune séance encore</div></div>`;
    return;
  }
  const groups={};
  S.history.forEach(e=>{
    const d=new Date(e.date).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
    if(!groups[d])groups[d]=[];groups[d].push(e);
  });
  for(const[date,entries] of Object.entries(groups)){
    html+=`<div class="hist-date-label">${date}</div>`;
    entries.forEach(e=>{
      const withPerf=e.exos.filter(x=>x.kg||x.rpe);
      html+=`<div class="hist-entry">
        <div class="hist-top">
          <div class="hist-sess">${e.label}</div>
          <div class="hist-lieu">📍 ${e.lieu} · S${e.week}</div>
        </div>
        <div class="hist-exos">
          ${withPerf.length?withPerf.map(x=>`<div class="hist-exo">
            <span class="hist-exo-name">${x.name}</span>
            <span class="hist-exo-val">${x.kg?x.kg+'kg':''}${x.kg&&x.rpe?' · ':''}${x.rpe?'RPE '+x.rpe:''}</span>
          </div>`).join(''):'<div style="font-size:11px;color:var(--txt3)">Aucune perf saisie</div>'}
        </div>
      </div>`;
    });
  }
  con.innerHTML=html;
}
function setChartKey(k){chartKey=k;renderHistory();}
function clearHistory(){if(confirm('Effacer tout l\'historique ?')){S.history=[];save();renderHistory();}}

// ═══════════════════════════════════════
// SETTINGS
// ═══════════════════════════════════════
function renderSettings(){
  let html=`
  <div class="settings-section">
    <div class="settings-title">Programme</div>
    <div class="setting-row">
      <div><div class="setting-label">Semaine en cours</div><div class="setting-sub">1 → 10</div></div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="s-btn" onclick="adjWeek(-1)">−</div>
        <div class="s-num" id="s-week">${S.week}</div>
        <div class="s-btn" onclick="adjWeek(1)">+</div>
      </div>
    </div>
    <div class="setting-row" onclick="resetProg()">
      <div><div class="setting-label">Réinitialiser le cycle</div><div class="setting-sub">Remet toutes les séances à "À faire"</div></div>
      <span style="color:var(--txt3)">›</span>
    </div>
  </div>

  <div class="div"></div>

  <div class="settings-section">
    <div class="settings-title">Minuteur repos</div>
    <div class="setting-row">
      <div><div class="setting-label">Durée par défaut</div></div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="s-btn" onclick="adjTimer(-15)">−</div>
        <div class="s-num" id="s-timer">${fmtTimer(S.timerDuration)}</div>
        <div class="s-btn" onclick="adjTimer(15)">+</div>
      </div>
    </div>
  </div>

  <div class="div"></div>

  <div class="settings-section" id="lieu-section">
    <div class="settings-title">Lieux d'entraînement</div>
    <div class="lieu-edit-list" id="lieu-edit-list"></div>
    <div class="lieu-add-row">
      <input class="lieu-add-input" id="new-lieu-input" placeholder="Nom du lieu (ex: MAISON AMI)" maxlength="20">
      <button class="lieu-add-btn" onclick="addLieu()">+ Ajouter</button>
    </div>
  </div>

  <div class="div"></div>

  <div class="settings-section">
    <div class="settings-title">Poids par exercice</div>
    <div style="font-size:11px;color:var(--txt3);margin-bottom:10px;padding:0 2px">Poids S1 par lieu · Incrément/semaine</div>`;

  Object.entries(S.poids).forEach(([name,vals])=>{
    html+=`<div class="ex-edit-card">
      <div class="ex-edit-name">${name}</div>
      <div class="ex-edit-fields">
        ${['HOME','BUREAU','PA','inc'].map(f=>`<div class="field-group">
          <span class="field-lbl">${f==='inc'?'INC':f}</span>
          <input class="field-inp" type="number" value="${vals[f]||0}"
            onchange="updatePoids('${name}','${f}',this.value)" inputmode="decimal">
        </div>`).join('')}
      </div>
    </div>`;
  });

  html+=`</div>
  <div class="div"></div>
  <div class="settings-section">
    <div class="settings-title">Remise à zéro</div>
    <div class="setting-row" onclick="resetPoids()">
      <div><div class="setting-label">Poids par défaut</div><div class="setting-sub">Annule toutes tes modifications</div></div>
      <span style="color:var(--txt3)">›</span>
    </div>
  </div>`;

  document.getElementById('settings-content').innerHTML=html;
  renderLieuEditList();
}

function renderLieuEditList(){
  const el=document.getElementById('lieu-edit-list');
  if(!el) return;
  el.innerHTML=S.lieux.map((l,i)=>`
    <div class="lieu-edit-row">
      <span style="font-size:12px;color:var(--txt3)">📍</span>
      <input class="lieu-edit-input" value="${l}" onchange="renameLieu(${i},this.value)">
      ${S.lieux.length>1?`<button class="lieu-edit-del" onclick="deleteLieu(${i})">×</button>`:''}
    </div>`).join('');
}

function addLieu(){
  const input=document.getElementById('new-lieu-input');
  const val=input.value.trim().toUpperCase();
  if(!val||S.lieux.includes(val)) return;
  S.lieux.push(val);
  input.value='';
  save();renderLieuEditList();renderLieuScroll();
  showToast(val+' ajouté ✓');
}
function deleteLieu(i){
  const l=S.lieux[i];
  if(S.lieux.length<=1){showToast('Au moins 1 lieu requis');return;}
  S.lieux.splice(i,1);
  if(S.lieu===l) S.lieu=S.lieux[0];
  save();renderLieuEditList();renderLieuScroll();
}
function renameLieu(i,val){
  const clean=val.trim().toUpperCase();
  if(!clean) return;
  S.lieux[i]=clean;
  if(S.lieu===S.lieux[i]) S.lieu=clean;
  save();renderLieuScroll();
}

function fmtTimer(s){return Math.floor(s/60)+"'"+String(s%60).padStart(2,'0')+'"';}
function adjWeek(d){S.week=Math.max(1,Math.min(10,S.week+d));document.getElementById('s-week').textContent=S.week;document.getElementById('wkNum').textContent=S.week;save();}
function adjTimer(d){
  S.timerDuration=Math.max(15,Math.min(600,S.timerDuration+d));
  timerTotal=S.timerDuration;timerRemaining=S.timerDuration;
  document.getElementById('s-timer').textContent=fmtTimer(S.timerDuration);
  updateTimerDisplay();save();
}
function updatePoids(name,field,val){if(!S.poids[name])S.poids[name]={};S.poids[name][field]=parseFloat(val)||0;save();}
function resetPoids(){if(confirm('Remettre tous les poids par défaut ?')){S.poids=JSON.parse(JSON.stringify(DEFAULT_POIDS));save();renderSettings();showToast('Poids réinitialisés ✓');}}
function resetProg(){if(confirm('Réinitialiser le cycle ?')){S.sessionDone={};S.exDone={};S.perf={};S.derog={};save();showToast('Cycle réinitialisé ✓');}}

// ═══════════════════════════════════════
// UTILS
// ═══════════════════════════════════════
function setLieu(l){S.lieu=l;save();renderHome();}
function changeWeek(d){S.week=Math.max(1,Math.min(10,S.week+d));save();renderHome();}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
load();
timerTotal=S.timerDuration;
timerRemaining=S.timerDuration;
updateTimerDisplay();
renderHome();
</script>
</body>
</html>
